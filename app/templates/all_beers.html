{% extends "base.html" %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'style/modal.css' %}">
<link rel="stylesheet" href="{% static 'style/switch.css' %}">
<style>#search-input::-webkit-search-cancel-button { display: none; }</style>

{# Barre unique : bières, brasseries, bars et membres. Le formulaire fonctionne sans JavaScript ; search.js le rend instantané. #}
<form id="search-form" method="get" data-user="{{ user.pk }}" action="{% url 'all_beers' %}" role="search" class="sticky top-0 z-30 -mx-4 px-4 pt-2 pb-1 bg-base-100/95 backdrop-blur">
    <input type="hidden" name="tab" value="{{ active_tab }}">
    <label class="input input-bordered flex items-center gap-2 w-full bg-white rounded-full h-11">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
        <input type="search" name="q" value="{{ query }}" maxlength="100" autocomplete="off" enterkeyhint="search" inputmode="search"
               placeholder="Bière, brasserie, bar, membre…" aria-label="Rechercher sur Pokebeer" class="grow text-sm bg-transparent" id="search-input">
        <button type="button" id="search-clear" class="btn btn-ghost btn-xs btn-circle {% if not query %}hidden{% endif %}" aria-label="Effacer la recherche"><svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg></button>
    </label>
    <noscript><button type="submit" class="btn btn-primary btn-sm w-full mt-2">Rechercher</button></noscript>
    <div id="recent-searches" class="hidden mt-2 pb-1" aria-label="Recherches récentes"></div>
</form>

<div id="search-results" data-url="{% url 'api_search' %}" aria-live="polite">
    {% include "partials/search_results.html" %}
</div>

<script src="{% static 'script/load_more_generic.js' %}"></script>
<script src="{% static 'script/nearby.js' %}"></script>
<script src="{% static 'script/recent_searches.js' %}"></script>
<script src="{% static 'script/search.js' %}"></script>
<script src="{% static 'script/wishlist.js' %}"></script>
{% endblock %}
