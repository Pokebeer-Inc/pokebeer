<div>
    <h4 class="font-bold text-[10px] text-gray-500 mb-2 uppercase tracking-wider">Alcool</h4>
    <div class="flex flex-wrap items-center gap-3">
        <label class="flex items-center gap-1 cursor-pointer"><input type="radio" name="degree" value="" class="radio radio-xs radio-primary" {% if not request.GET.degree %}checked{% endif %} /><span class="text-xs">Toutes</span></label>
        <label class="flex items-center gap-1 cursor-pointer"><input type="radio" name="degree" value="light" class="radio radio-xs radio-primary" {% if request.GET.degree == 'light' %}checked{% endif %} /><span class="text-xs">Légère (<5%)</span></label>
        <label class="flex items-center gap-1 cursor-pointer"><input type="radio" name="degree" value="regular" class="radio radio-xs radio-primary" {% if request.GET.degree == 'regular' %}checked{% endif %} /><span class="text-xs">Moyenne (5-8%)</span></label>
        <label class="flex items-center gap-1 cursor-pointer"><input type="radio" name="degree" value="strong" class="radio radio-xs radio-primary" {% if request.GET.degree == 'strong' %}checked{% endif %} /><span class="text-xs">Forte (>8%)</span></label>
    </div>
</div>

<div>
    <h4 class="font-bold text-[10px] text-gray-500 mb-2 uppercase tracking-wider">Amertume (IBU)</h4>
    <div class="flex flex-wrap items-center gap-3">
        <label class="flex items-center gap-1 cursor-pointer"><input type="radio" name="ibu" value="" class="radio radio-xs radio-secondary" {% if not request.GET.ibu %}checked{% endif %} /><span class="text-xs">Toutes</span></label>
        <label class="flex items-center gap-1 cursor-pointer"><input type="radio" name="ibu" value="low" class="radio radio-xs radio-secondary" {% if request.GET.ibu == 'low' %}checked{% endif %} /><span class="text-xs">Douce (<20)</span></label>
        <label class="flex items-center gap-1 cursor-pointer"><input type="radio" name="ibu" value="medium" class="radio radio-xs radio-secondary" {% if request.GET.ibu == 'medium' %}checked{% endif %} /><span class="text-xs">Modérée (20-50)</span></label>
        <label class="flex items-center gap-1 cursor-pointer"><input type="radio" name="ibu" value="high" class="radio radio-xs radio-secondary" {% if request.GET.ibu == 'high' %}checked{% endif %} /><span class="text-xs">Forte (>50)</span></label>
    </div>
</div>

<div>
    <h4 class="font-bold text-[10px] text-gray-500 mb-2 uppercase tracking-wider">Style</h4>
    <select name="style" class="w-full h-12 px-3 border border-base-300 rounded-lg bg-white text-sm outline-none focus:border-primary appearance-auto" style="-webkit-appearance: auto;">
        <option value="">Tous les styles</option>
        {% for style_name in styles %}
            <option value="{{ style_name }}" {% if request.GET.style == style_name %}selected{% endif %}>{{ style_name }}</option>
        {% endfor %}
    </select>
</div>
