{% comment %}Liste « À goûter » du Carnet : rendue par la page et par le fragment htmx (recherche et tri en direct).{% endcomment %}
<div id="carnet-wishlist-container" class="flex flex-col gap-2">
    {% include "partials/wishlist_tiles.html" %}
</div>
{% if page_full %}
<button class="btn-load-more-generic btn btn-outline btn-sm w-full mt-3"
        data-offset="10"
        data-container="carnet-wishlist-container"
        data-url="{% url 'load_more_generic' 'wishlist_tiles' %}?q={{ query|urlencode }}&sort={{ sort }}"
        data-autoscroll="false">
    Charger plus de bières
</button>
{% endif %}
