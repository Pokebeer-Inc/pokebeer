<div class="card shadow-md border-2 transition-all flex flex-col group hover:scale-[1.02] min-h-[170px]
    {% if ach.tier_slug == 'locked' %}bg-base-200 border-base-300
    {% elif ach.tier_slug == 'bronze' %}bg-gradient-to-br from-[#CD7F32] to-[#8C5722] border-[#CD7F32]/50 shine-effect
    {% elif ach.tier_slug == 'silver' %}bg-gradient-to-br from-[#F8F8F8] to-[#C0C0C0] border-[#C0C0C0]/50 shine-effect
    {% elif ach.tier_slug == 'gold' %}bg-gradient-to-br from-[#FFF080] to-[#FFD700] border-[#FFD700]/50 shine-effect
    {% elif ach.tier_slug == 'platinum' %}bg-gradient-to-br from-[#FFFFFF] to-[#E5E4E2] border-[#E5E4E2]/50 shine-effect{% endif %}">
    
    <div class="card-body p-3 flex flex-col justify-between items-center text-center relative z-10 w-full h-full">
        
        <!-- ICÔNE -->
        <div class="w-12 h-12 rounded-full flex items-center justify-center bg-white shadow-sm shrink-0 mb-2 
            {% if ach.tier_slug == 'locked' %}text-gray-400
            {% elif ach.tier_slug == 'bronze' %}text-[#CD7F32]
            {% elif ach.tier_slug == 'silver' %}text-gray-600
            {% elif ach.tier_slug == 'gold' %}text-[#D4AF37]
            {% elif ach.tier_slug == 'platinum' %}text-gray-500{% endif %}">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                {% include "partials/achievement_icon.html" with slug=ach.slug %}
            </svg>
        </div>
        
        <!-- TEXTES -->
        <div class="flex flex-col justify-center flex-1 min-h-0 w-full gap-1">
            <h3 class="font-bold text-sm sm:text-base leading-tight mb-0.5 w-full break-words
                {% if ach.tier_slug == 'locked' %}text-gray-800
                {% elif ach.tier_slug == 'bronze' %}text-white
                {% else %}text-gray-900{% endif %}">{{ ach.name }}</h3>
            <p class="text-xs leading-snug 
                {% if ach.tier_slug == 'locked' %}text-gray-500
                {% elif ach.tier_slug == 'bronze' %}text-white/80
                {% elif ach.tier_slug == 'silver' %}text-gray-700
                {% elif ach.tier_slug == 'gold' %}text-yellow-900
                {% elif ach.tier_slug == 'platinum' %}text-gray-600{% endif %}">{{ ach.desc }}</p>
        </div>
        
        <!-- PROGRESSION -->
        <div class="w-full shrink-0 mt-2">
            <div class="flex justify-between items-end mb-1">
                <span class="text-xs font-bold opacity-90 
                    {% if ach.tier_slug == 'locked' %}text-gray-800
                    {% elif ach.tier_slug == 'bronze' %}text-white
                    {% else %}text-gray-900{% endif %}">
                    {% if ach.is_maxed %}MAX{% else %}{{ ach.current }} / {{ ach.target }}{% endif %}
                </span>
                
                {% if ach.tier_name != "Bloqué" %}
                    <span class="badge badge-xs font-bold text-[9px] uppercase tracking-wider border-none shadow-sm
                        {% if ach.tier_slug == 'bronze' %}bg-white text-[#CD7F32]
                        {% elif ach.tier_slug == 'silver' %}bg-gray-800 text-[#C0C0C0]
                        {% elif ach.tier_slug == 'gold' %}bg-gray-900 text-[#FFD700]
                        {% elif ach.tier_slug == 'platinum' %}bg-indigo-900 text-[#E5E4E2]{% endif %}">
                        {{ ach.tier_name }}
                    </span>
                {% endif %}
            </div>
            <progress class="progress w-full h-1.5 bg-black/10 
                {% if ach.tier_slug == 'locked' %}progress-neutral
                {% elif ach.tier_slug == 'bronze' %}[&::-webkit-progress-value]:bg-white [&::-moz-progress-bar]:bg-white
                {% elif ach.tier_slug == 'silver' %}[&::-webkit-progress-value]:bg-gray-800 [&::-moz-progress-bar]:bg-gray-800
                {% elif ach.tier_slug == 'gold' %}[&::-webkit-progress-value]:bg-gray-900 [&::-moz-progress-bar]:bg-gray-900
                {% elif ach.tier_slug == 'platinum' %}[&::-webkit-progress-value]:bg-indigo-900 [&::-moz-progress-bar]:bg-indigo-900{% endif %}" 
                value="{{ ach.progress }}" max="100"></progress>
        </div>
    </div>
</div>
