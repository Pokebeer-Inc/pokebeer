<div class="flex flex-col items-center justify-center p-6 bg-white border border-base-200 rounded-xl shadow-sm text-center mb-4">
    {% if show_icon %}
    <div class="w-12 h-12 bg-primary/10 text-primary rounded-full flex items-center justify-center mb-3">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" /></svg>
    </div>
    {% endif %}
    
    <h3 class="font-bold text-sm md:text-base text-gray-800 mb-1">{{ title }}</h3>
    
    {% if description %}
    <p class="text-[10px] md:text-xs text-gray-500 mb-3">{{ description }}</p>
    {% endif %}
    
    <div class="flex flex-col gap-3 w-full max-w-xs mt-2">
        <a href="{% url 'add_beer' %}" class="btn btn-primary btn-sm w-full text-white">{{ add_btn_text|default:"Ajouter une bière au catalogue" }}</a>
        
        {% if show_browse %}
        <a href="{% url 'all_beers' %}" class="btn btn-outline btn-primary btn-sm w-full">Parcourir les bières</a>
        {% endif %}
    </div>
</div>
