{% comment %}Signalement d'un membre. Paramètres : modal_id (id du dialog), username (membre signalé).{% endcomment %}
<dialog id="{{ modal_id }}" class="modal z-[99999]">
    <div class="modal-box custom-modal-form">
        {% include "partials/modal_header.html" with title="Signaler ce profil" %}
        
        <form method="post" action="{% url 'submit_report' %}">
            {% csrf_token %}
            <input type="hidden" name="item_type" value="user">
            <input type="hidden" name="item_ref" value="{{ username }}">
            
            <div class="form-control w-full mb-3">
                <label class="label py-1"><span class="label-text text-xs font-bold">Date</span></label>
                <input type="text" value="{% now 'd/m/Y' %}" class="input input-sm input-bordered w-full bg-base-200 text-gray-500 cursor-not-allowed" readonly>
            </div>
            
            <div class="form-control w-full mb-3">
                <label class="label py-1"><span class="label-text text-xs font-bold">Raison du signalement</span></label>
                <select name="reason" class="pb-select" required>
                    <option value="" disabled selected>Choisissez une raison...</option>
                    <option value="spam">Spam ou publicité</option>
                    <option value="offensive">Contenu offensant / haineux</option>
                    <option value="fake">Fausse information / Faux profil</option>
                    <option value="other">Autre raison</option>
                </select>
            </div>
            
            <div class="form-control w-full mb-4">
                <label class="label py-1"><span class="label-text text-xs font-bold">Description détaillée</span></label>
                <textarea name="description" class="textarea textarea-bordered h-24" placeholder="Veuillez expliquer pourquoi vous signalez ce membre..." minlength="10" maxlength="1000" data-char-counter required></textarea>
            </div>
            
            <button type="submit" class="btn btn-error w-full text-white">Envoyer le signalement</button>
        </form>
    </div>
    <form method="dialog" class="modal-backdrop"><button>Fermer</button></form>
</dialog>
