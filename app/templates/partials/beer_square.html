{% comment %}Visuel carré d'une bière : sa photo officielle, sinon un fond neutre. Paramètre : beer.{% endcomment %}
{% if beer.image %}
<img src="{{ beer.image.url }}" alt="" width="48" height="48" loading="lazy" decoding="async" class="w-12 h-12 rounded-xl object-cover shrink-0 pointer-events-none bg-base-300">
{% else %}
<span class="w-12 h-12 rounded-xl shrink-0 pointer-events-none border border-base-200 bg-base-200 text-gray-400 flex items-center justify-center" aria-hidden="true">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M6 7h9v11a2 2 0 01-2 2H8a2 2 0 01-2-2V7zm9 2h2a2 2 0 012 2v3a2 2 0 01-2 2h-2M6 7c0-1.5 1.2-2.5 2.5-2.5.5-1 1.5-1.5 2.5-1.5s2 .5 2.5 1.5C14.8 4.5 15 5.5 15 7" /></svg>
</span>
{% endif %}
