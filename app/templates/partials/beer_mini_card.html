{% comment %}Carte compacte d'une bière recommandée. Paramètre : beer.{% endcomment %}
<a href="{% url 'beer_detail' beer.slug %}" class="pb-card block w-[44%] shrink-0 snap-start p-2.5 hover:bg-base-300 active:scale-[0.98] transition-all">
    {% if beer.image %}
    <img src="{{ beer.image.url }}" alt="" width="200" height="120" loading="lazy" decoding="async" class="w-full h-[74px] rounded-xl object-cover bg-base-300">
    {% else %}
    <span class="w-full h-[74px] rounded-xl border border-base-200 bg-base-200 text-gray-400 flex items-center justify-center" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-9 w-9" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M6 7h9v11a2 2 0 01-2 2H8a2 2 0 01-2-2V7zm9 2h2a2 2 0 012 2v3a2 2 0 01-2 2h-2M6 7c0-1.5 1.2-2.5 2.5-2.5.5-1 1.5-1.5 2.5-1.5s2 .5 2.5 1.5C14.8 4.5 15 5.5 15 7" /></svg>
    </span>
    {% endif %}
    <p class="font-semibold leading-tight mt-2 line-clamp-2 min-h-[2.5rem]">{{ beer.name }}</p>
    <p class="text-sm text-gray-600 truncate">{% if beer.style %}{{ beer.style }} · {% endif %}{{ beer.degree|floatformat:"-1" }} %</p>
</a>
