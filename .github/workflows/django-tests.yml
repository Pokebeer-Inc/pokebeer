name: Django CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    # Configuration des services annexes (Base de données)
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Setup Node.js and Tailwind
      uses: actions/setup-node@v4
      with:
         node-version: '20'
    - run: python manage.py tailwind install
    - run: python manage.py tailwind build

    - name: Run Pytest
      env:
        DATABASE_URL: 'postgresql://test_user:test_password@localhost:5432/test_db'
        
        SECRET_KEY: 'cle-secrete-bidon-inutile-de-la-cacher-ici'
        DEBUG: 'False'
        
        GEMINI_API_KEY: 'cle-factice-pour-les-tests'
      run: |
        pytest