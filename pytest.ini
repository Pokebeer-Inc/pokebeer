[pytest]

DJANGO_SETTINGS_MODULE = pokebeer.settings

testpaths = tests
python_files = test_*.py

# Un test marqué xfail qui se met à passer fait échouer la CI : on retire alors le marqueur.
xfail_strict = true

markers =
    known_bug: défaut connu de l'application, documenté par un test xfail en attendant sa correction

addopts = --strict-markers -ra --cov=app --cov=pokebeer --cov-report=term-missing
